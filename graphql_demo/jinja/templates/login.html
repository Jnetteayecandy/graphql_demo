<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rate Limit Demo</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles/style.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            padding: 36px 32px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 8px;
            color: #1a1a1a;
            font-size: 24px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #444;
        }
        .login-card input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .login-card input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #1d4ed8;
        }
        #result-box {
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
            text-align: left;
            line-height: 1.5;
            word-break: break-word;
        }
        .badge-success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .badge-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .badge-warning {
            background: #fffbeb;
            color: #92400e;
            border: 1px solid #fde68a;
        }
        .rate-limit-badge {
            margin-top: 20px;
            padding: 10px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
            font-size: 12px;
            color: #64748b;
        }
        .rate-limit-badge strong {
            color: #0f172a;
        }
        .hint-text {
            margin-top: 14px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="margin-bottom: 24px;">เข้าสู่ระบบ</h2>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
        </form>

        <div id="result-box"></div>
    </div>

    <script>
        let attemptCount = 0;
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultBox = document.getElementById('result-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            attemptCount++;
            
            submitBtn.disabled = true;
            submitBtn.innerText = "กำลังเข้าสู่ระบบ...";

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                const data = await res.json().catch(() => ({}));
                resultBox.style.display = 'block';

                if (res.status === 200 && data.success) {
                    resultBox.className = 'badge-success';
                    resultBox.innerHTML = `<strong>✅ ครั้งที่ #${attemptCount}: ล็อกอินสำเร็จ!</strong><br>กำลังพาคุณเข้าสู่หน้า Jinja Dashboard...`;
                    setTimeout(() => {
                        window.location.href = data.redirect || '/dashboard';
                    }, 800);
                } else if (res.status === 429) {
                    resultBox.className = 'badge-error';
                    const detail = data.message || data.detail || 'Rate limit exceeded.';
                    resultBox.innerHTML = `<strong>🚫 ถูกระงับชั่วคราว (429 Too Many Requests)</strong><br>${detail}`;
                } else {
                    resultBox.className = 'badge-error';
                    const errorMsg = data.detail || data.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
                    resultBox.innerHTML = `<strong>❌ ครั้งที่ #${attemptCount}: เข้าสู่ระบบไม่สำเร็จ (${res.status})</strong><br>${errorMsg}`;
                }
            } catch (err) {
                resultBox.style.display = 'block';
                resultBox.className = 'badge-warning';
                resultBox.innerHTML = `<strong>⚠️ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้</strong><br>${err.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Sign In";
            }
        });
    </script>
</body>
</html>
